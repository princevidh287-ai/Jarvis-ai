name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev git zip unzip openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev autoconf libtool pkg-config

    - name: Install Python Tools
      run: |
        python3.10 -m pip install --upgrade pip setuptools wheel
        python3.10 -m pip install "cython<3.0.0"
        python3.10 -m pip install buildozer

    - name: Build APK with Buildozer
      env:
        APP_ACCEPT_SDK_LICENSES: 1
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        python3.10 -m buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
