name: Build APK via Container

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install System Dependencies inside Container
      run: |
        apt-get update
        apt-get install -y python3.10 python3.10-dev python3-pip build-essential libffi-dev git zip unzip openjdk-17-jdk ffmpeg libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev zlib1g-dev autoconf libtool pkg-config
        
    - name: Setup Python Tools
      run: |
        python3.10 -m pip install --upgrade pip setuptools wheel
        python3.10 -m pip install "cython<3.0.0"
        python3.10 -m pip install buildozer

    - name: Build APK with Buildozer
      env:
        APP_ACCEPT_SDK_LICENSES: 1
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        python3.10 -m buildozer --warn_on_root=0 -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
