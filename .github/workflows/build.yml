name: Build APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev python3-dev git zip unzip openjdk-17-jdk
        pip install --upgrade pip
        pip install "cython==0.29.33"
        pip install buildozer

    - name: Auto Accept Android SDK Licenses & Build
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        export APP_ACCEPT_SDK_LICENSES=1
        yes | buildozer -v android debug || buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Jarvis-APK
        path: bin/*.apk
        
